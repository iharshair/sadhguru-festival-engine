name: Daily Festival Poster Engine

on:
  schedule:
    # Runs at 19:30 IST (14:00 UTC) as a backup alongside Cron-Job.org
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Optional: Test a specific date (YYYY-MM-DD), e.g., 2026-11-11'
        required: false
        default: ''

jobs:
  send-festival-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pillow

      - name: Run Poster Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          CLIENT_WA_NUMBER: ${{ secrets.CLIENT_WA_NUMBER }}
          TEST_DATE: ${{ github.event.inputs.test_date }}
        run: python engine.py
